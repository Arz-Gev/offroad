<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0d0f12" />
  <!-- Add to Home Screen: full screen, landscape (iPhone Safari has no fullscreen button for pages) -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Offroad" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <title>Offroad Defender</title>
  <style>
    /* only what the page needs before the JS (and src/ui.css) loads */
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0d0f12; color: #eef1f4; font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { touch-action: manipulation; }   /* no double-tap zoom on phones */
    canvas#c { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
    canvas#c:active { cursor: grabbing; }
    [hidden] { display: none !important; }
    #loading { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #1a1e25 0%, #0d0f12 70%); transition: opacity .5s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .ld-box { width: min(340px, calc(100vw - 48px)); text-align: center; }
    #loading .ld-eyebrow { font: 700 11px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #ffb347; }
    #loading .ld-title { margin-top: 8px; font: 800 28px/1.1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .01em; }
    #loading .ld-bar { height: 3px; margin: 22px 0 10px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
    #loading .ld-bar i { display: block; height: 100%; background: #ffb347; transform-origin: 0 50%; transform: scaleX(var(--p, .04)); transition: transform .3s ease; }
    #loading .ld-t { color: rgba(238,241,244,.6); font-size: 13px; min-height: 1.4em; }
    #loading.error .ld-bar i { background: #ff5a45; }
    #loading .ld-err { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: rgba(255,90,69,.1); border: 1px solid rgba(255,90,69,.35); color: #ffd2cb; font-size: 13px; line-height: 1.5; text-align: left; }
    #loading .ld-err button { margin-top: 10px; height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; font: 600 13px/1 inherit; cursor: pointer; }
    #loading noscript { display: block; margin-top: 14px; color: #ffd2cb; }
  </style>
</head>
<body>
  <canvas id="c" aria-label="Game view"></canvas>
  <div id="hud"></div>
  <div id="menu" class="overlay" hidden></div>
  <div id="intro" class="overlay" hidden></div>
  <div id="loading" role="status" aria-live="polite">
    <div class="ld-box">
      <div class="ld-eyebrow">Offroad</div>
      <div class="ld-title">Defender 110</div>
      <div class="ld-bar"><i></i></div>
      <div class="ld-t">Loading…</div>
      <div class="ld-err" hidden></div>
      <noscript>This game needs JavaScript.</noscript>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
